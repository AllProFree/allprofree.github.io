["ایپ (جیسے کیپ کٹ) کا تعارف: پروجیکٹ بنانا، ٹائم لائن اور میڈیا امپورٹ کرنا۔","کلپ کو کاٹنا، تقسیم کرنا، ترتیب بدلنا اور فالتو حصے ہٹانا۔","آواز کی سطح ٹھیک کرنا اور مناسب پس منظر موسیقی ڈالنا۔ کاپی رائٹ فری موسیقی استعمال کریں۔","ٹرانزیشن اور ایفیکٹس کا معتدل استعمال، تاکہ ویڈیو صاف نظر آئے۔","اردو سب ٹائٹل ڈالنا: خودکار کیپشن، غلطی کی درستی اور فونٹ کا انتخاب۔","رنگوں کی درستی: روشنی، کنٹراسٹ اور سیچوریشن کی سیٹنگ۔","ویڈیو کو مناسب ریزولوشن میں ایکسپورٹ کریں اور یوٹیوب پر عنوان، تفصیل اور ٹیگ کے ساتھ اپ لوڈ کریں۔"],
["اے آئی ٹولز کی اقسام: متن، تصویر، ویڈیو اور آواز۔ مفت اور قابل اعتماد ٹولز کا انتخاب۔","اچھا پرامپٹ: واضح مقصد، تفصیل، انداز اور مثال۔ ایک ہی پرامپٹ بہتر کر کے نتیجے کا فرق دیکھیں۔","اے آئی سے تصاویر بنانا اور ان میں حسب منشا تبدیلی کرنا۔","اے آئی سے مختصر ویڈیو کلپ بنانا اور کلپس کو آپس میں جوڑنا۔","اسکرپٹ لکھوانا اور اے آئی آواز بنانا۔ ہر مواد خود پڑھ کر درست کریں۔","اے آئی مواد کو ایڈیٹنگ ایپ میں ملا کر بہتر بنانا۔ اسلامی مواد میں خاص احتیاط کریں اور حوالہ ضرور جانچیں۔","آخری پروجیکٹ: موضوع، اسکرپٹ، تصاویر، آواز اور ایڈیٹنگ کے ساتھ مکمل ویڈیو تیار کریں۔"],
["فیس بک، یوٹیوب، انسٹاگرام اور ٹک ٹاک کی خصوصیات اور ناظرین کا فرق۔","پروفائل تصویر، نام، تعارف اور لنک: ہر جگہ ایک جیسی برانڈنگ۔","ہفتہ وار مواد کا کیلنڈر: کس دن کیا پوسٹ کرنا ہے اور موضوعات کی فہرست۔","پوسٹ اور ریلز شیڈول کرنے کے ٹولز اور مناسب وقت کا انتخاب۔","فالوورز بڑھانے کے طریقے: مفید مواد، تسلسل، ہیش ٹیگ اور ناظرین سے رابطہ۔","کمنٹس اور پیغامات کا بروقت اور مہذب جواب دینا۔ ناپسندیدہ تبصروں کو سنبھالنا۔","ماہانہ رپورٹ: ویوز، فالوورز اور ردعمل دیکھنا۔ آمدن کے جائز مواقع جیسے مونیٹائزیشن اور سروسز۔"]

tabs:["Children’s Curriculum","Adult Islamic Studies","Digital Skills"],
intro:["Annual curriculum for ages 4–5: 12 months, 5 lessons a month, 60 lessons in all.","Three sequenced courses for youth and adults: Quran, worship and everyday matters.","Five free courses, each going from the basics to building your own project."],
kids:[
["Month 1: Arabic Letters (1)",["Alif, Ba, Ta, Tha","Jim, Ha, Kha","Dal, Dhal, Ra, Zay","Sin, Shin, Sad, Dad","Ta, Za, Ain, Ghain"],["Recognise the shape and sound of four letters. The teacher says it, the child repeats, then traces the shape in the air.","These three look alike; only the dots differ. Show dotted and undotted letters side by side.","These letters do not join to the next letter. Repeat names and sounds from flashcards.","Sin and Shin have teeth; Sad and Dad have round bellies. Sad and Dad are read with a heavy sound.","Ta and Za are heavy letters. Ain comes from the throat; practise it slowly."]],
["Month 2: Arabic Letters (2)",["Fa, Qaf, Kaf","Lam, Mim, Nun","Waw, Ha, Hamza, Ya","Full alphabet reading","Letter recognition game"],["Explain the difference between Fa and Qaf. Qaf is deep and heavy; Kaf is light.","Learn the shape and sound, then Urdu words that start with each letter.","Complete the last four letters to finish the alphabet.","Read the whole alphabet in order, then in reverse, then from shuffled cards.","The child picks a card and names it; a star for each correct answer. Note the weak letters."]],
["Month 3: Short Vowels",["Zabar (fatha)","Zer (kasra)","Pesh (damma)","All three vowels together","Vowel practice"],["A small stroke above a letter gives the “a” sound, as in a ba ta. Repeat with every letter.","A stroke below a letter gives the “i” sound, as in i bi ti.","A small waw-like mark above gives the “u” sound, as in u bu tu.","Read one letter with all three vowels (ba bi bu), then repeat with other letters.","Write vowelled letters on a slate or notebook and read them. Correct mistakes gently."]],
["Month 4: Tanween and Sukoon",["Double zabar","Double zer","Double pesh","Sukoon (jazm)","Practice and revision"],["A light “n” sound is added at the end. Stretch the sound a little when reciting.","Practise with the teacher, repeating many times.","Listen for the difference between the three tanween and learn to recognise them.","A small circle means the letter is read without a vowel: the first letter has a vowel, the second is silent.","Mixed practice with tanween and sukoon words, correcting pronunciation."]],
["Month 5: Madd and Shaddah",["Madd (elongation)","Standing fatha, kasra, inverted damma","Shaddah","Joining letters into words","Practice and revision"],["When a sound is stretched a little longer it is called madd. Practise stretching the sound.","These marks make the sound long, as in baa bee boo.","A shaddah doubles the letter: first with a sukoon, then with a vowel.","Read two- and three-letter words by joining letters.","Practise words with madd and shaddah."]],
["Month 6: Short Surahs (1)",["Surah Al-Fatihah: verses 1–3","Surah Al-Fatihah: the rest","Surah An-Nas","Surah Al-Falaq","Review"],["The teacher recites one verse at a time and the children repeat. Explain the meaning in simple language.","Memorise the remaining verses, then recite the whole surah once in order.","Six verses. Memorise one verse a day until complete.","Five verses. Teach in small pieces by listening and repeating.","Listen to and recite all three surahs. Give each child a turn and correct pronunciation."]],
["Month 7: Short Surahs (2)",["Surah Al-Ikhlas","Surah Al-Masad","Surah An-Nasr","Surah Al-Kafirun","Review"],["Four verses on the oneness of Allah. Memorise with a simple meaning.","Five verses. Focus on pronunciation and teach in small pieces.","Three verses. Explain the message of Allah’s help and gratitude.","Six verses. Memorise by repeating many times.","Review the month’s four surahs; each child recites in turn."]],
["Month 8: Daily Duas",["Before and after eating","Sleeping and waking","Entering and leaving home","Entering the restroom","Dua for parents"],["Say Bismillah before eating and thank Allah afterwards. Build the habit of eating with the right hand.","Say Bismillah and the dua before sleeping and lie on the right side. Thank Allah on waking.","Say Bismillah and greet the family when entering; say Bismillah when leaving too.","Teach the dua; enter with the left foot and leave with the right.","“My Lord, have mercy on them as they raised me when I was small.” Learn it in Arabic with this meaning."]],
["Month 9: Cleanliness and Prayer Preparation",["Cleanliness","How to make wudu","Adhan etiquette","Preparing for prayer","Parts of the prayer"],["Cleanliness is part of faith. Teach washing hands and face, trimming nails and wearing clean clothes.","Steps in order: intention, hands, rinsing the mouth, nose, face, arms, wiping the head, feet. Practise hands-on.","Teach listening quietly to the adhan, responding to it, and the dua after it.","A clean place, clean clothes and facing the qibla. Teach making the intention in the heart.","Recognise standing, bowing, prostration and sitting. Show each one by doing it."]],
["Month 10: Kalimas and Faith",["Kalima Tayyiba","Kalima Shahadat","Kalima Tamjeed","Names of Allah (1)","Names of Allah (2)"],["There is no god but Allah; Muhammad ﷺ is the Messenger of Allah. Learn it in Arabic with its meaning.","The declaration of faith: I bear witness that there is no god but Allah alone, and that Muhammad is His servant and messenger.","Glorify Allah, praise Him and declare His oneness and greatness. Learn the Arabic with its meaning.","Allah, Ar-Rahman, Ar-Rahim, Al-Khaliq, Ar-Raziq. Explain the simple meaning of each.","As-Sami, Al-Basir, Al-Ghafur, Al-Karim, Al-Wadud. Give a simple meaning and an everyday example."]],
["Month 11: Islamic Manners",["Greeting with salam","Telling the truth","Respecting parents","Respecting teachers","Neighbours and guests"],["Say “As-salamu alaykum” and reply “Wa alaykum as-salam”. Make greeting a habit.","Use a short story to show the value of truth and the harm of lying.","Listen attentively, keep a low voice and help them.","Greet the teacher, sit politely, listen and say thank you.","Look after neighbours, respect guests and share your things."]],
["Month 12: Review and Exam",["Review the primer","Review the surahs","Review duas and kalimas","Oral exam","Annual celebration"],["Review all primer lessons and practise weak letters and vowels again.","Review all the surahs learned, listening to each child.","Review all duas and kalimas with their meanings.","Oral exam: letters, vowels, one surah and one dua. Encourage every child.","Give prizes and certificates and tell parents about the year’s progress."]]

["Quran and Tajweed",["Points of articulation","Characteristics of letters","Rules of noon sakin and tanween","Rules of meem sakin","Rules of madd","Stopping and starting","Common mistakes","Daily recitation routine"],["There are five main areas: the empty space, throat, tongue, lips and nasal passage. Learn where each letter is produced.","Qualities such as jahr, hams, shiddah, rakhawah, tafkhim and tarqiq distinguish similar letters.","Four rules: idhhar, idgham, iqlab and ikhfa. Practise each with the letters it applies to.","Three rules: ikhfa shafawi, idgham shafawi and idhhar shafawi.","Natural madd and its secondary types: muttasil, munfasil, lazim. Keep the correct length.","Where to pause and where to resume. Learn the pause signs.","Confusing Qaf and Kaf, Tha and Sin, Dhal and Zay and similar pairs. Drill each one.","Recite daily at a fixed time, practise the rules you learn and recite to a qari."]],
["Prayer and Worship",["Wudu and ghusl","Prayer in full","Prayer supplications","Fasting","Zakat basics","Hajj and Umrah basics"],["Four obligatory acts of wudu (Hanafi): face, arms including elbows, a quarter of the head, feet including ankles. Ghusl: rinse the mouth and nose and wash the whole body.","Pillars: standing, recitation, bowing, prostration and the final sitting. Conditions: purity, covering, qibla, time and intention.","Learn thana, tashahhud, durood Ibrahimi and the closing dua with correct pronunciation.","Fasting means abstaining from food, drink and marital relations from true dawn to sunset. Learn intention, suhoor, iftar and what breaks the fast.","Zakat is two and a half percent of wealth once nisab is reached and a year has passed. Consult a reliable scholar for details and recipients.","A summary of the basic acts, ihram, tawaf and sai. Learn the details from a reliable guide before travelling."]],
["Everyday Religious Matters",["Halal and haram","Honesty in business","Family rights","Social media etiquette","Good character","Lessons from the Seerah"],["Earn lawfully, avoid interest, deceit and bribery, and be careful with doubtful matters.","Be truthful, give fair measure, keep promises and write down transactions.","Rights of parents, spouse, children and relatives. Kindness and keeping family ties.","Avoid backbiting, slander and false news. Verify before sharing and cite reliable sources in your posts.","Patience, gratitude, forgiveness, controlling anger and humility. Set one good deed to do daily.","Key events of the Prophet’s ﷺ life and the practical lessons they offer."]]
